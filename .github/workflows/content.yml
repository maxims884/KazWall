# Каждый день добавляет в приложение 1 новые обои и 1–2 открытки.
# Картинки и catalog.json лежат в ветке content этого же репозитория — приложение читает их оттуда.
# Секреты не нужны: бот пишет в репозиторий встроенным токеном GitHub Actions.
name: Daily content

on:
  schedule:
    - cron: "0 4 * * *"   # 09:00 по Астане
  workflow_dispatch:
    inputs:
      command:
        description: "daily, daily-cards, seed-cards или wallpapers"
        default: "daily"
      count:
        description: "Сколько штук для seed-cards и wallpapers"
        default: "30"

permissions:
  contents: write

concurrency: content

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ветка с картинками — в папку content, куда бот кладёт новые файлы
      - uses: actions/checkout@v4
        with:
          ref: content
          path: content
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: content_bot/requirements.txt
      - run: pip install -r content_bot/requirements.txt
      - name: Run bot
        working-directory: content_bot
        env:
          CONTENT_DIR: ${{ github.workspace }}/content
          # Ручной запуск берёт команду из формы, расписание — из переменной DAILY_COMMAND, иначе daily
          COMMAND: ${{ github.event.inputs.command || vars.DAILY_COMMAND || 'daily' }}
          COUNT: ${{ github.event.inputs.count || '30' }}
        run: python bot.py "$COMMAND" --count "$COUNT"
      - name: Publish
        working-directory: content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Новых картинок нет"
          else
            git commit -m "Контент за $(date -u +%F)"
            git push
          fi
